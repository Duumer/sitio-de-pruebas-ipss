# Configuración nginx vulnerable para Desafío 4: Análisis de Configuración Errónea
# CONTIENE CONFIGURACIONES INSEGURAS INTENCIONALES PARA FINES EDUCATIVOS

# ============================================
# VULNERABILIDAD 1: CORS Wildcard (Permite cualquier origen)
# ============================================
add_header 'Access-Control-Allow-Origin' '*' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
add_header 'Access-Control-Allow-Credentials' 'true' always;

# ============================================
# VULNERABILIDAD 2: Cabeceras de Seguridad Faltantes
# ============================================
# FALTA: Content-Security-Policy (CSP)
# FALTA: Strict-Transport-Security (HSTS)
# FALTA: X-Frame-Options
# FALTA: X-Content-Type-Options
# FALTA: Referrer-Policy
# FALTA: Permissions-Policy

# ============================================
# VULNERABILIDAD 3: Header de Debug Expuesto (CONTIENE LA FLAG)
# ============================================
add_header 'X-Debug-Token' 'IPSS{misconfig_cors_wildcard}' always;
add_header 'X-Server-Info' 'nginx/1.18.0 (Ubuntu) - IPSS Internal' always;
add_header 'X-Powered-By' 'PHP/8.1.0' always;

# ============================================
# VULNERABILIDAD 4: Directory Listing Habilitado
# ============================================
autoindex on;

# ============================================
# VULNERABILIDAD 5: Versión del Servidor Expuesta
# ============================================
server_tokens on;

# ============================================
# VULNERABILIDAD 6: Archivos Sensibles Accesibles
# ============================================
location ~ /\.(git|env|htaccess|htpasswd) {
    allow all;  # DEBERÍA SER: deny all;
}

location ~ \.(sql|bak|backup|log|conf)$ {
    allow all;  # DEBERÍA SER: deny all;
}

# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name ctf.ipss.cl www.ctf.ipss.cl;
    
    # Redirección HTTP a HTTPS (COMENTADA - VULNERABILIDAD)
    # return 301 https://$server_name$request_uri;
    
    root /var/www/ipss-ctf;
    index index.php index.html;
    
    # Logging
    access_log /var/log/nginx/ipss_access.log;
    error_log /var/log/nginx/ipss_error.log;
    
    # PHP Handling
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # VULNERABILIDAD: Sin validación de script real (FPM exploit)
        # fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }
    
    # Static files - caching inseguro
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        # FALTA: add_header X-Content-Type-Options nosniff;
    }
    
    # API endpoints sin rate limiting
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
        # FALTA: limit_req zone=api burst=10 nodelay;
    }
    
    # Admin panel sin protección adicional
    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
        # FALTA: allow 192.168.1.0/24; deny all;
        # FALTA: auth_basic "Admin Area"; auth_basic_user_file /etc/nginx/.htpasswd;
    }
}

